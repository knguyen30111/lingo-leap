name: package-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Record toolchain
        run: |
          node -v
          npm -v
          rustc --version
          cargo --version

      - name: Install dependencies (locked)
        run: npm ci

      - name: Build macOS bundle
        run: npm run tauri:build

      - name: Archive the .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf "$GITHUB_WORKSPACE/lingo-leap-app.tar.gz" ./*.app

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: lingo-leap-dmg-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Upload app bundle archive
        uses: actions/upload-artifact@v7
        with:
          name: lingo-leap-app-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: lingo-leap-app.tar.gz
          retention-days: 14
          if-no-files-found: error
